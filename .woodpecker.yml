# Woodpecker CI for tessera
# Parity rule: every step calls the same npm script or sh script as local verification.
# Local equivalents: npm run verify (build, test:coverage, lint) and npm run security.
# Known gaps with a local equivalent that cannot run offline: see README "CI and local parity".

when:
  event: [push, pull_request]
  branch: [main]

steps:
  install:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    commands:
      - echo "Containment: local release gate only, not proven in CI"
      - npm ci

  build:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    commands:
      - npm run build

  lint:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    commands:
      - npm run lint

  test:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    environment:
      NODE_ENV: test
    commands:
      - npm run test:coverage

  secrets-scan:
    image: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    commands:
      - sh scripts/ci/secrets.sh

  dependency-audit:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    commands:
      - npm run security:deps

  license-check:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    commands:
      - npm run security:licenses

  sast:
    image: returntocorp/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    commands:
      - sh scripts/ci/sast.sh

  sonarqube:
    image: sonarsource/sonar-scanner-cli@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57
    environment:
      SONAR_HOST_URL:
        from_secret: sonar_host_url
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - sonar-scanner -Dsonar.projectKey=tessera -Dsonar.sources=src -Dsonar.tests=tests -Dsonar.test.inclusions=**/*.test.ts -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info -Dsonar.coverage.exclusions=**/*.test.ts,**/test/**,**/tests/**,demo/** -Dsonar.exclusions=demo/** -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
