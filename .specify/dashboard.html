s above already carry their README and AGENTS.md lines, this task closes what is left): README (topology, host prerequisites podman >= 5 with cgroup v2 `memory` and `pids` delegated, scripts `isolation:build`, `isolation:check`, `isolation:sweep`, `temporal:pki`, `temporal:local`, `test:isolation`, `release:gate`, the sentence that CI cannot prove containment and the known deviation R16, the isolation limits), AGENTS.md commands and quality gates, CHANGELOG entry under Unreleased, `docs/assurance-roadmap.md` (items 006 and 008 status, item 012 note), working agreement Tier C list reconciled with R18; regenerate the dashboard after touching `specs/` with the command from `.tessl/plugins/tessl-labs/intent-integrity-kit/rules/dashboard-refresh.md`: `bash .tessl/plugins/tessl-labs/intent-integrity-kit/skills/iikit-core/scripts/bash/generate-dashboard-safe.sh`","checked":false,"isBugFix":false},{"id":"T063","storyTag":null,"bugTag":null,"description":"Final security review checkpoint (plan row 23, no commit unless findings): the isolated runner, path translation, image helpers, advisory fetch, Temporal access, PKI and registry against the R14 payloads and the released diff; a second pass by another model family; append to `docs/review-005-security.md`; fix findings before the feature counts as done","checked":false,"isBugFix":false},{"id":"T064","storyTag":null,"bugTag":null,"description":"Re-run the mutation loop of every Tier C task against the final tree for the mutants that matter most (drop `--network none`, accept a tag reference, prefix without `/` boundary, `not-applied` mandatory as `partial`, replay with an empty snapshot, accept a non-loopback address, accept a client without certificate, register `import *`); record kill results in `docs/review-005-security.md`","checked":false,"isBugFix":false},{"id":"T065","storyTag":null,"bugTag":null,"description":"Independent model review of the whole diff by a different model family than the builders (builders are Claude and Qwen; reviewer: GLM or Kimi, read-only), triage in `docs/review-005-<model>.md`; record \"approved by independent review: <model>, triage <file>\" in the commit body when there is no open valid high finding and every valid finding is fixed or an issue","checked":false,"isBugFix":false},{"id":"T066","storyTag":null,"bugTag":null,"description":"Phase ritual: write `docs/retro/005.md` from `docs/retro/TEMPLATE.md` (what worked, what broke, numbers: demo recall, isolation overhead, CI red time, deviations), run `npm run dogfood` and triage the findings in `docs/dogfood/`, and do the goal check against spec success criteria SC-001 to SC-009 (record each as met or not with the evidence); tag the release only after `npm run release:gate` is green locally; checklist line: for each deployed commit that changed workflow code (T035, T042) the worker drain command and its result are recorded (verify in the commit bodies)","checked":false,"isBugFix":false}],"progress":"0/17","column":"todo"}],"in_progress":[],"done":[],"integrity":{"status":"valid","currentHash":"6bd09a91a73bff9c88eba5ef129148e4e2ddd7c51d178bfcac53b725f5ee85e4","storedHash":"6bd09a91a73bff9c88eba5ef129148e4e2ddd7c51d178bfcac53b725f5ee85e4"}},"pipeline":{"phases":[{"id":"constitution","name":"Premise &\nConstitution","status":"complete","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"spec","name":"Spec","status":"complete","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"plan","name":"Plan","status":"complete","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"checklist","name":"Checklist","status":"not_started","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"testify","name":"Testify","status":"complete","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"tasks","name":"Tasks","status":"complete","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"analyze","name":"Analyze","status":"not_started","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"implement","name":"Implement","status":"not_started","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]}]},"storyMap":{"stories":[{"id":"US1","title":"Hostile source cannot escape","priority":"P1","scenarioCount":5,"body":"An operator audits a repository they do not trust. The repository may contain paths that point\noutside itself, links to host files, code that spawns processes without end, output of absurd\nsize, code that calls out to the network while being scanned, and attempts to write outside its\nown working area. Every audit runs in its own throwaway isolated execution environment that is\ndiscarded after the audit. Inside it the audited source is read-only, scanners have no network\naccess while scanning, and time, memory, process count, and output size are limited. The host\nframework never executes audited code.\n\n**Why this priority**: The independent review confirmed that a scan can execute code from the\naudited repository. Until this is closed the framework cannot be pointed at any source it does not\nalready trust, which blocks assurance level 2.\n\n**Independent Test**: Run an audit against each attack fixture (path traversal, symbolic links\nto host files, process flood, huge output, network call at scan time, writes outside the\nworkspace). In every case the host, other audits, and the evidence are unchanged, and the audit\nends with a defined outcome.\n\n**Acceptance Scenarios**:\n\n1. **Given** a repository whose paths or links point outside itself, **When** an audit runs,\n   **Then** no host file is read, written, or reported, and the attempt is recorded in the evidence.\n2. **Given** a repository that tries to write outside its workspace or to modify the audited\n   source, **When** an audit runs, **Then** the write fails, nothing outside the environment\n   changes, and the attempt is recorded.\n3. **Given** a repository that floods the system with processes or produces output beyond the\n   limit, **When** the audit runs, **Then** the step ends at its limit, is reported as failed or\n   partial with the cause, and the host and other audits keep working normally.\n4. **Given** a repository that attempts a network call while being scanned, **When** the audit\n   runs, **Then** the call does not leave the environment and the attempt is recorded.\n5. **Given** any audit that has ended, whether complete, incomplete, or crashed, **When** the end\n   state is inspected, **Then** its isolated environment and working area no longer exist.","clarificationCount":0},{"id":"US2","title":"Same results when isolated","priority":"P1","scenarioCount":3,"body":"A consultant wants isolation without losing audit quality. Run isolated, an audit finds the same\nplanted defects as before and still produces an evidence bundle that verifies with a valid\nsignature.\n\n**Why this priority**: Isolation that degrades results or breaks the evidence chain is not\nusable; the levels reached so far must not be lowered (constitution XII).\n\n**Independent Test**: Run the demo release gate and the dogfood run in isolated mode. Recall on\nthe demo ground truth is not lower than 8 of 18, the dependency defects D05 to D07 are still\nfound, and verification reports a valid signature.\n\n**Acceptance Scenarios**:\n\n1. **Given** the demo vulnerable source, **When** it is audited isolated, **Then** recall is at\n   least 8 of 18 and D05, D06, D07 are reported.\n2. **Given** a completed isolated audit, **When** verification runs with the trusted public key,\n   **Then** it reports a valid signature and no modified, missing, or extra record.\n3. **Given** the framework's own repository, **When** the dogfood run completes isolated, **Then**\n   all scanners are completed and the outcome is complete.","clarificationCount":0},{"id":"US3","title":"Orchestration reachable only locally and authenticated","priority":"P1","scenarioCount":4,"body":"An operator runs the framework on a shared or networked machine. The orchestration service that\nstarts and controls audits accepts connections only from the same machine, and only from clients\nthat authenticate. An unauthenticated client, or a client from another machine, is refused.\n\n**Why this priority**: The review found the service open to every network interface without\nauthentication, so anyone who could reach it could start, read, or steer audits.\n\n**Independent Test**: From the same machine without credentials, from the same machine with\nvalid credentials, and from another machine, attempt to start and query an audit.\n\n**Acceptance Scenarios**:\n\n1. **Given** a running framework, **When** a client without credentials connects locally,\n   **Then** it is refused and cannot start or read any audit.\n2. **Given** a running framework, **When** a client on another machine tries to connect, **Then**\n   the connection is refused whatever credentials it presents.\n3. **Given** a local client with valid credentials, **When** it starts an audit, **Then** the\n   audit runs normally.\n4. **Given** the framework is configured to listen beyond the local machine, **When** it\n   starts, **Then** it refuses to start unless the exposure is explicit and authenticated.","clarificationCount":0},{"id":"US4","title":"Never silently unisolated","priority":"P1","scenarioCount":3,"body":"An operator starts an audit on a machine where isolation cannot be provided. The audit is\nreported INCOMPLETE and says why. The framework never falls back to running the audited source\nwithout isolation (constitution VII).\n\n**Why this priority**: A silent fallback would reproduce the original defect while looking safe.\n\n**Independent Test**: Make the isolation capability unavailable and start an audit. The audit\nends INCOMPLETE with the cause, no scanner has touched the audited source, and no clean result\nis shown for any area.\n\n**Acceptance Scenarios**:\n\n1. **Given** the isolation capability is missing or unusable, **When** an audit starts, **Then**\n   no audited content is scanned, the outcome is INCOMPLETE, and the report names the cause.\n2. **Given** isolation became unavailable between two steps of one audit, **When** the next step\n   would run, **Then** the audit stops, is INCOMPLETE, and the completed steps keep their evidence.\n3. **Given** isolation is unavailable, **When** the report is read, **Then** it never states\n   \"no findings\" for areas that were not scanned.","clarificationCount":0},{"id":"US5","title":"Legacy command-text checks unreachable","priority":"P2","scenarioCount":3,"body":"Older checks assemble commands as text and run them with interpretation. They are not part of\nthe verified scan path. They are no longer registered with the worker and cannot be started by\nany client.\n\n**Why this priority**: They are the injection surface named in the review. Removing their\nreachability closes it now; their migration is separate work.\n\n**Independent Test**: Ask the worker for the list of runnable activities and attempt to start each\nlegacy check by name. None is available; the verified scan path still runs.\n\n**Acceptance Scenarios**:\n\n1. **Given** a running worker, **When** its registered activities are listed, **Then** none of the\n   legacy command-text checks is present.\n2. **Given** a client that requests a legacy check by name, **When** the request is made, **Then**\n   it fails as unknown and nothing is executed.\n3. **Given** the verified scan path, **When** an audit runs, **Then** it is unaffected.","clarificationCount":0},{"id":"US6","title":"Report states the isolation actually used","priority":"P2","scenarioCount":4,"body":"A consultant or client reading the report needs to know how isolated the audit was and what that\ndoes not cover. The report states the isolation level used, derived from what actually happened\nin that audit, and lists its limits. Each isolated step has its own evidence record.\n\n**Why this priority**: Constitution XII forbids hand-entered assurance; a claim of isolation must\ncome from recorded facts.\n\n**Independent Test**: Complete one isolated audit and one audit where isolation was unavailable.\nThe first report states the isolation used with limits and every step has an isolation record;\nthe second states that no isolation was applied.\n\n**Acceptance Scenarios**:\n\n1. **Given** a completed isolated audit, **When** the report is read, **Then** it states the\n   isolation level reached, what was restricted (access to the source, network, resources), and\n   the known limits.\n2. **Given** a completed isolated audit, **When** the evidence is listed, **Then** each isolated\n   step has a record showing the environment used and the restrictions that applied.\n3. **Given** an audit where a restriction could not be applied, **When** the report is read,\n   **Then** the stated level is lowered accordingly and the missing restriction is named.\n4. **Given** verification of the evidence, **When** it runs, **Then** the stated isolation level\n   is recomputed from the records and a mismatch is reported.","clarificationCount":0}],"requirements":[{"id":"FR-001","text":"The system MUST run every audit in its own isolated execution environment, created"},{"id":"FR-002","text":"The system MUST NOT execute audited code, configuration, or repository metadata"},{"id":"FR-003","text":"The audited source MUST be read-only inside the environment; any write to it MUST"},{"id":"FR-004","text":"Scanners MUST have no network access while scanning; any attempt MUST fail and be"},{"id":"FR-005","text":"The system MUST enforce limits on run time, memory, number of processes, and output"},{"id":"FR-006","text":"Paths and links in the audited source that resolve outside the audited source MUST"},{"id":"FR-007","text":"Nothing created inside an environment MUST be visible to, or able to modify, the"},{"id":"FR-008","text":"Concurrent audits MUST use separate environments and MUST NOT share source copies,"},{"id":"FR-009","text":"The system MUST provide scanners with a private, size-limited temporary area inside"},{"id":"FR-010","text":"When isolation is unavailable at the start of an audit or before any step, the"},{"id":"FR-011","text":"The system MUST NOT run any step unisolated as a fallback, by default or by"},{"id":"FR-012","text":"The orchestration service MUST accept connections only from the local machine."},{"id":"FR-013","text":"The orchestration service MUST refuse every client that does not present valid"},{"id":"FR-014","text":"The system MUST NOT register the legacy command-text checks with the worker, and a"},{"id":"FR-015","text":"Every isolated step MUST produce an evidence record stating the environment used,"},{"id":"FR-016","text":"The report MUST state the isolation level used for the audit and its known limits,"},{"id":"FR-017","text":"Verification MUST recompute the isolation level from the evidence and report a"},{"id":"FR-018","text":"A restriction that could not be applied MUST lower the stated isolation level and"},{"id":"FR-019","text":"The system MUST produce the same findings and a verifiable signed evidence bundle"},{"id":"FR-020","text":"Data that scanners need from outside the audited source (such as advisory data)"},{"id":"FR-021","text":"The system MUST remove all working data of an audit on every exit path, and MUST"},{"id":"FR-022","text":"The system MUST provide attack fixtures for path traversal, links to host files,"}],"successCriteria":[{"id":"SC-001","text":"100% of attack fixtures are contained: after each, the host, other audits, and"},{"id":"SC-002","text":"Against the demo ground truth run isolated, recall is not lower than 8 of 18 and"},{"id":"SC-003","text":"100% of isolated audits produce evidence that verifies with a valid signature."},{"id":"SC-004"," age built by `npm run isolation:build`; the Temporal server image `temporalio/server:1.32.0` pinned by digest (replaces `temporal server start-dev`)"},{"label":"Storage","value":"unchanged from 004 (private work directory under `os.tmpdir()`, evidence bundle under `TESSERA_EVIDENCE_ROOT`, report under `outputDir`). New local, non-versioned files: `~/.config/tessera/isolation.json` (pinned image ID), `~/.config/tessera/temporal-pki/` (CA and certificates, 0700/0600)"},{"label":"Testing","value":"vitest 5 hermetic unit and integration tests with fake `ProcessRunner` and recorded `inspect`/cgroup fixtures (in `npm run verify` and CI); `npm run test:isolation` with a real runtime and the image (local release gate); `npm run test:tools` (unchanged); cucumber scenarios from `/iikit-04-testify`; `npm run demo` and `npm run dogfood` as ground-truth gates; `npm run release:gate` runs all local gates"},{"label":"Target Platform","value":"Linux worker host with rootless podman (developed on Fedora, kernel 7.2, SELinux enforcing, podman 5.8.7); Temporal server in a rootless container on the same host"},{"label":"Project Type","value":"single project (`src/`, `tests/`, `config/`, `demo/`, `scripts/`)"},{"label":"Performance Goals","value":"isolation overhead ≤ 20 s per demo audit and ≤ 25 % of the audit's wall time, computed from record durations; one container start measured at 0.69 s"},{"label":"Constraints","value":"no unisolated fallback by default or by configuration (FR-011); no new npm dependency; no host mount other than the declared source directory (and, in development only, the read-only source mirror); the source never reaches the host disk beyond `TESSERA_MAX_SOURCE_MB` (default 1024); scanners have no network while scanning; existing limits stay (stdout 64 MiB, stderr 1 MiB, per-tool timeouts, ≤ 2000 findings per step); a worker with 4 parallel steps needs about 8 GiB for audit containers"},{"label":"Scale/Scope","value":"one repository per audit, about 12 containe ":"T036","storyTag":"US6","bugTag":null,"description":"Implement `src/evidence/sign.ts`, `src/cli/evidence-keygen.ts`, `signature.json`, and extend `verify.ts` with signature status to pass [TS-031, TS-032, TS-033, TS-035, TS-036]","checked":true,"isBugFix":false},{"id":"T037","storyTag":"US6","bugTag":null,"description":"Add computed assurance level, signing time disclaimer and `TESSERA_REQUIRE_SIGNATURE` handling to workflow result and report [TS-034, TS-036]; make the product name configurable (default Tessera) and the report language English with an optional Dutch setting","checked":true,"isBugFix":false},{"id":"T038","storyTag":"US6","bugTag":null,"description":"Write step definitions for `signed-evidence.feature` and run them green [TS-031, TS-032, TS-033, TS-034, TS-035, TS-036]","checked":true,"isBugFix":false}],"progress":"4/4","column":"done"}],"integrity":{"status":"valid","currentHash":"cc7bd7a7b20af30daaeea8421900c9905d52ef498216fcbfdecab07ad288dae6","storedHash":"cc7bd7a7b20af30daaeea8421900c9905d52ef498216fcbfdecab07ad288dae6"}},"pipeline":{"phases":[{"id":"constitution","name":"Premise &\nConstitution","status":"complete","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"spec","name":"Spec","status":"complete","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"plan","name":"Plan","status":"complete","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"checklist","name":"Checklist","status":"not_started","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"testify","name":"Testify","status":"complete","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"tasks","name":"Tasks","status":"complete","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"analyze","name":"Analyze","status":"not_started","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"implement","name":"Implement","status":"in_progress","progress":"94%","optional":false,"clarifications":0,"clarificationEntries":[]}]},"storyMap":{"stories":[{"id":"US1","title":"Honest scan outcome","priority":"P1","scenarioCount":4,"body":"A consultant reads an audit report and needs to know which checks actually ran. Every scanner\nand check shows an explicit status. If any scanner failed, was missing, or only partly ran,\nthe audit is marked INCOMPLETE and the summary says what was not scanned. A report never says\n\"no findings\" for something that was not scanned.\n\n**Why this priority**: Without it a failed scanner looks like a clean system. This is the\nlargest trust defect found in the independent review and blocks every enterprise use.\n\n**Independent Test**: Run an audit against a source with known defects while one scanner is\nmade unavailable. The report is INCOMPLETE, names the unavailable scanner, and does not show\nthat scanner's area as clean.\n\n**Acceptance Scenarios**:\n\n1. **Given** a scanner is not installed, **When** an audit runs, **Then** the report shows that\n   scanner as unavailable, the audit as INCOMPLETE, and no clean result for its area.\n2. **Given** a scanner crashes mid-run, **When** the audit finishes, **Then** the scanner status\n   is failed, the cause is recorded, and the audit is INCOMPLETE.\n3. **Given** all scanners complete and find nothing, **When** the audit finishes, **Then** the\n   report states \"no findings\" together with the list of completed scanners.\n4. **Given** a scanner exits with a non-zero code because it found issues, **When** the audit\n   finishes, **Then** the status is completed and the issues are reported as findings.","clarificationCount":0},{"id":"US2","title":"Evidence record for every step","priority":"P1","scenarioCount":3,"body":"An auditor wants proof of what the audit did, not only what it found. Every executed step\nproduces an evidence record: what was run and with which inputs, the tool version, start and\nend time, the result code, and a fingerprint of the raw output. Every finding points to the\nrecord that produced it. The run records which exact revision of the audited source was scanned.\n\n**Why this priority**: This turns the audit trail into an evidence log that a third party can\nrely on, as required by the constitution (Evidence-First).\n\n**Independent Test**: Complete an audit, then pick any finding. Follow its link to the evidence\nrecord and confirm the step, tool version, source revision, and raw-output fingerprint.\n\n**Acceptance Scenarios**:\n\n1. **Given** a completed audit, **When** a reviewer opens any finding, **Then** it links to the\n   evidence record of the step that produced it.\n2. **Given** a completed audit, **When** a reviewer lists the evidence, **Then** every executed\n   step, including steps that found nothing or failed, has a record.\n3. **Given** an audit of a source repository, **When** the run finishes, **Then** the evidence\n   states the exact source revision that was scanned.","clarificationCount":0},{"id":"US3","title":"No findings lost when a tool reports issues","priority":"P2","scenarioCount":2,"body":"A dependency scanner reports vulnerabilities by returning a non-zero result. The audit treats\nthis as \"issues found\" and reports every vulnerability, not as an error to be discarded.\n\n**Why this priority**: In the independent review, known vulnerable dependencies produced zero\nfindings. Recall on dependency defects is the most visible quality gap.\n\n**Independent Test**: Audit the demo vulnerable source. The three planted dependency defects\n(D05, D06, D07 in the ground truth) appear as findings with the expected severity.\n\n**Acceptance Scenarios**:\n\n1. **Given** a source with known vulnerable dependencies, **When** the audit runs, **Then** each\n   known vulnerability is reported with severity and affected package.\n2. **Given** a very large scanner output, **When** the audit runs, **Then** no findings are\n   lost to output size limits; truncation is reported as partial.","clarificationCount":0},{"id":"US4","title":"Verifiable evidence integrity","priority":"P2","scenarioCount":2,"body":"A reviewer or client can verify that the evidence has not changed after the audit. A manifest\nlists all evidence with fingerprints. A verification step recomputes them and reports any\nmismatch, missing, or extra record.\n\n**Why this priority**: Evidence only counts as proof if tampering is detectable.\n\n**Independent Test**: Alter one evidence record after an audit. Verification reports exactly that\nrecord as modified; unmodified evidence verifies clean.\n\n**Acceptance Scenarios**:\n\n1. **Given** unmodified evidence, **When** verification runs, **Then** it reports success.\n2. **Given** one modified, deleted, or added record, **When** verification runs, **Then** it\n   reports a failure naming that record.","clarificationCount":0},{"id":"US5","title":"Evidence without exposed secrets","priority":"P3","scenarioCount":1,"body":"Findings of type secret carry enough information to locate and fix the issue but never contain\nthe secret value in clear text in evidence, logs, or reports.\n\n**Why this priority**: Evidence is shared with clients and retained; secrets in it are a\nsecond leak.\n\n**Independent Test**: Audit a source containing a planted secret. Search all evidence, logs, and\nreports for the secret value; it does not appear.\n\n**Acceptance Scenarios**:\n\n1. **Given** a source with a planted secret, **When** the audit completes, **Then** the secret\n   value appears nowhere in evidence, reports, or logs, while its location and type do.","clarificationCount":0},{"id":"US6","title":"Signed evidence","priority":"P2","scenarioCount":4,"body":"A client or auditor wants to know who vouches for the evidence and that it has not been rewritten\nsince. When an audit ends, the evidence manifest is signed with a key held by the framework\noperator, and verification reports whether the signature is valid and which key signed it. The\nfirst version uses a locally held key; stronger key custody follows in later versions.\n\n**Why this priority**: A manifest with only hashes proves internal consistency. Anyone with\nwrite access can recompute it. A signature ties the evidence to a key that others can check.\n\n**Independent Test**: Complete an audit, verify it, then change one record and recompute the\nmanifest by hand. Verification fails because the signature no longer matches.\n\n**Acceptance Scenarios**:\n\n1. **Given** a completed audit, **When** verification runs with the published public key,\n   **Then** it reports the signature as valid and names the key.\n2. **Given** evidence whose manifest was recomputed after a change, **When** verification\n   runs, **Then** it reports the signature as invalid.\n3. **Given** evidence without a signature or verified with a different key, **When**\n   verification runs, **Then** it reports \"unsigned\" or \"unknown key\" and never \"verified\".\n4. **Given** a signed audit, **When** a reviewer reads the report, **Then** the report states\n   what was signed, by which key, and that the signing time is the signer's own clock and not\n   independently attested.","clarificationCount":0}],"requirements":[{"id":"FR-001","text":"The system MUST assign each scanner and check one status per audit: completed,"},{"id":"FR-002","text":"The system MUST mark an audit INCOMPLETE when any required scanner is not"},{"id":"FR-003","text":"The system MUST NOT report an area as clean unless its scanner status is completed."},{"id":"FR-004","text":"The system MUST distinguish \"scanner reported issues\" from \"scanner failed\"."},{"id":"FR-005","text":"The system MUST create an evidence record for every executed step, including steps"},{"id":"FR-006","text":"An evidence record MUST contain the action and its inputs, the tool identity and"},{"id":"FR-007","text":"Every finding MUST reference the evidence record that produced it."},{"id":"FR-008","text":"The system MUST record the exact revision of the audited source in the evidence."},{"id":"FR-009","text":"The system MUST produce a manifest listing all evidence records with their"},{"id":"FR-010","text":"The system MUST provide a verification that recomputes fingerprints and reports"},{"id":"FR-011","text":"Evidence MUST be immutable after creation and retained for at least one year."},{"id":"FR-012","text":"The system MUST redact secret values in evidence, logs, and reports while keeping"},{"id":"FR-013","text":"The system MUST report truncated or size-limited scanner output as partial."},{"id":"FR-014","text":"Scan settings that originate from the audited source MUST NOT change scanner"},{"id":"FR-015","text":"Evidence from separate audits MUST NOT mix, including audits that run at the same"},{"id":"FR-016","text":"The report MUST show the overall audit outcome (complete or INCOMPLETE) and the"},{"id":"FR-017","text":"The system MUST make the evidence set available as one folder containing all"},{"id":"FR-018","text":"The system MUST sign the evidence manifest of every completed or incomplete audit"},{"id":"FR-019","text":"Verification MUST report one of: valid signature, invalid signature, unsigned, or"},{"id":"FR-020","text":"Reports MUST state the assurance level reached by the audit's evidence, derived"}],"successCriteria":[{"id":"SC-001","text":"In 100% of audits where a scanner is unavailable or failed, the report is marked"},{"id":"SC-002","text":"100% of executed steps have an evidence record, and 100% of findings link to one."},{"id":"SC-003","text":"Against the demo ground truth, the three dependency defects (D05, D06, D07) are"},{"id":"SC-004","text":"Verification detects 100% of modified, deleted, and added evidence records in a"},{"id":"SC-005","text":"A search for each planted secret value across all evidence, logs, and reports"},{"id":"SC-006","text":"A reviewer can trace ,{"id":"spec","name":"Spec","status":"complete","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"plan","name":"Plan","status":"complete","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"checklist","name":"Checklist","status":"not_started","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"testify","name":"Testify","status":"complete","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"tasks","name":"Tasks","status":"complete","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"analyze","name":"Analyze","status":"not_started","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]},{"id":"implement","name":"Implement","status":"not_started","progress":null,"optional":false,"clarifications":0,"clarificationEntries":[]}]},"storyMap":{"stories":[{"id":"US1","title":"Generate Markdown Report","priority":"P1","scenarioCount":3,"body":"**As a security auditor**, I want a comprehensive audit report in Markdown format so that I can review findings and present them to stakeholders.\n\n**Why this priority**: The report is the primary deliverable of the audit. Without it, the audit has no output.\n\n**Independent Test**: Can be tested by completing an audit and verifying the report is generated with all required sections.\n\n**Acceptance Scenarios**:\n\n1. **Given** an audit completes successfully, **When** the Reporting phase runs, **Then** the system generates a Markdown report at the specified path\n2. **Given** a report is generated, **When** I open it, **Then** it contains: executive summary, methodology, findings by severity, compliance mappings, recommendations\n3. **Given** findings exist, **When** the report is generated, **Then** each finding includes: ID, severity, title, description, evidence path, remediation","clarificationCount":0},{"id":"US2","title":"Collect Evidence Artifacts","priority":"P1","scenarioCount":3,"body":"**As a compliance officer**, I want evidence artifacts for each finding so that I can validate the audit results and demonstrate compliance.\n\n**Why this priority**: Evidence is required for compliance audits. Without it, findings are not actionable.\n\n**Independent Test**: Can be tested by checking that evidence files exist for each finding.\n\n**Acceptance Scenarios**:\n\n1. **Given** a finding is identified, **When** the report is generated, **Then** an evidence JSON file is created\n2. **Given** an evidence file exists, **When** I open it, **Then** it contains: scan type, raw output, affected files, line numbers, timestamps\n3. **Given** multiple scans run, **When** evidence is collected, **Then** each scan type produces separate evidence files","clarificationCount":0},{"id":"US3","title":"Export Compliance Report","priority":"P2","scenarioCount":3,"body":"**As a compliance officer**, I want compliance-specific reports for each framework so that I can demonstrate compliance to auditors.\n\n**Why this priority**: Compliance reporting is essential for enterprise customers but can be derived from main report.\n\n**Independent Test**: Can be tested by running audit with specific framework and checking compliance report output.\n\n**Acceptance Scenarios**:\n\n1. **Given** I specified ISO 27001, **When** the audit completes, **Then** a compliance report is generated with ISO 27001 control mappings\n2. **Given** I specified multiple frameworks, **When** the audit completes, **Then** separate compliance reports are generated for each framework\n3. **Given** a compliance report is generated, **When** I open it, **Then** it shows: control ID, control name, status (pass/fail), evidence","clarificationCount":0},{"id":"US4","title":"Archive Audit Artifacts","priority":"P3","scenarioCount":2,"body":"**As a security auditor**, I want all audit artifacts archived in a single location so that I can access them later for reference.\n\n**Why this priority**: Convenience for audit trail and historical reference. Not critical for immediate use.\n\n**Independent Test**: Can be tested by verifying all artifacts are collected in the output directory.\n\n**Acceptance Scenarios**:\n\n1. **Given** an audit completes, **When** I check the output directory, **Then** all artifacts are present: report, evidence, raw scan outputs, compliance reports\n2. **Given** artifacts are archived, **When** I list the directory, **Then** it follows the structure: /tmp/audit-<id>/{report.md, evidence/, raw/, compliance/}","clarificationCount":0}],"requirements":[{"id":"FR-001","text":"System MUST generate a Markdown audit report"},{"id":"FR-002","text":"System MUST include executive summary with finding counts by severity"},{"id":"FR-003","text":"System MUST document methodology and scope"},{"id":"FR-004","text":"System MUST list all findings with severity, description, remediation"},{"id":"FR-005","text":"System MUST map findings to compliance frameworks when specified"},{"id":"FR-006","text":"System MUST generate evidence JSON files for each finding"},{"id":"FR-007","text":"System MUST include raw scan outputs in evidence directory"},{"id":"FR-008","text":"System MUST generate compliance-specific reports per framework"},{"id":"FR-009","text":"System MUST use configurable output directory (default: /tmp/audit-<id>)"},{"id":"FR-010","text":"System MUST clean up temporary files after archiving"},{"id":"FR-011","text":"System MUST log report generation success/failure"}],"successCriteria":[{"id":"SC-001","text":"Report generated within 30 seconds of audit completion"},{"id":"SC-002","text":"100% of findings have corresponding evidence files"},{"id":"SC-003","text":"Evidence files valid JSON format"},{"id":"SC-004","text":"Report file size under 10MB for typical audits"},{"id":"SC-005","text":"Compliance reports generated for all specified frameworks"},{"id":"SC-006","text":"Output directory follows documented str man-in-the-loop.\n\n**Independent Test**: Can be tested by scanning a repository with known P0 vulnerabilities and verifying the workflow pauses.\n\n**Acceptance Scenarios**:\n\n1. **Given** P0 findings are detected, **When** the Reviewing phase completes, **Then** the workflow pauses and waits for approval signal\n2. **Given** no P0 findings exist, **When** the Reviewing phase completes, **Then** the workflow proceeds directly to Reporting\n3. **Given** the workflow is paused for approval, **When** I send approval signal (true), **Then** the workflow proceeds to Reporting","clarificationCount":0},{"id":"US2","title":"Reject and Stop","priority":"P2","scenarioCount":2,"body":"**As a security lead**, I want to reject P0 findings and stop the audit so that critical issues can be addressed before continuing.\n\n**Why this priority**: Safety mechanism to prevent audits from proceeding when critical issues need immediate attention.\n\n**Independent Test**: Can be tested by sending reject signal and verifying workflow stops.\n\n**Acceptance Scenarios**:\n\n1. **Given** the workflow is paused for approval, **When** I send reject signal (false), **Then** the workflow stops and marks the audit as failed\n2. **Given** the workflow is rejected, **When** I check the status, **Then** the system shows \"rejected\" with P0 finding details","clarificationCount":0},{"id":"US3","title":"Skip Approval","priority":"P3","scenarioCount":1,"body":"**As a CI/CD pipeline**, I want to skip P0 approval for automated audits so that audits can run unattended.\n\n**Why this priority**: Automation use case. Not critical for human-driven audits but useful for CI integration.\n\n**Independent Test**: Can be tested by starting audit with --skip-approval flag.\n\n**Acceptance Scenarios**:\n\n1. **Given** I start an audit with --skip-approval, **When** P0 findings are detected, **Then** the workflow proceeds without pausing","clarificationCount":0}],"requirements":[{"id":"FR-001","text":"System MUST d
